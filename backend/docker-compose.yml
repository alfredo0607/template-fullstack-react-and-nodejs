services:
  postgres:
    image: postgres:15
    container_name: postgres_db
    environment:
      POSTGRES_DB: exampledb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      TZ: America/Bogota
      PGTZ: America/Bogota
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admin -d exampledb']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  mysql:
    image: mysql:8.0
    container_name: mysql_db
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: exampledb
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin123
      MYSQL_ROOT_PASSWORD: root123
      TZ: America/Bogota
    ports:
      - '3307:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'admin', '-padmin123']
      interval: 5s
      timeout: 10s
      retries: 10
    networks:
      - app_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend_app
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      - TZ=America/Bogota
      - POSTGRES_HOST=postgres
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
    depends_on:
      postgres:
        condition: service_healthy
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app_network

volumes:
  postgres_data:
  mysql_data:

networks:
  app_network:
    driver: bridge
